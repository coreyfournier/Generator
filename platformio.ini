; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]

[env:Native]
platform = native
test_framework = unity
debug_test = test/*
build_flags = 
	${env.build_flags}
	-v
	'-DPIO_UNIT_TESTING'
test_filter = test/*
test_build_src = false
lib_deps = 
	throwtheswitch/Unity@^2.5.2
	arcao/Syslog@^2.0.0


[env:featheresp32]
platform = espressif32
board = featheresp32
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dout
lib_deps = 
	adafruit/Adafruit LIS3DH@^1.2.4
	SPI
	Wire
	adafruit/Adafruit BusIO@^1.14.1
	adafruit/Adafruit Unified Sensor@^1.1.7
	adafruit/Adafruit TSL2591 Library@^1.4.3
	bblanchon/ArduinoJson@^6.21.3
	arcao/Syslog@^2.0.0
	knolleary/PubSubClient@^2.8
build_flags = 
	${env.build_flags}
	-std=c++11
	'-DWIFI_PASSWORD="${sysenv.ENV_WIFI_PW}"'
	'-DWIFI_SSID="${sysenv.ENV_WIFI_SSID}"'	
	'-DLOG_SERVER_NAME="${sysenv.ENV_LOG_SERVER_NAME}"'
	'-DLOG_SERVER_PORT=${sysenv.ENV_LOG_SERVER_PORT}'	
	'-DMQTT_USER="${sysenv.ENV_MQTT_USER}"'
	'-DMQTT_PASSWORD="${sysenv.ENV_MQTT_PW}"'
	'-DOTA_PASSWORD="${sysenv.ENV_OTA_PW}"'
build_unflags = 
	'-DPIO_UNIT_TESTING'

; Upload over WiFi instead of USB: pio run -e featheresp32_ota -t upload (or -t uploadfs).
; Requires ENV_OTA_PW to match the password the running firmware was built with.
; Use --upload-port <ip> if generator.local does not resolve.
[env:featheresp32_ota]
extends = env:featheresp32
upload_protocol = espota
upload_port = generator.local
upload_flags = 
	--auth=${sysenv.ENV_OTA_PW}

[env:adafruit_feather_esp32_v2]
platform = espressif32
board = featheresp32
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dout
lib_deps = 
	adafruit/Adafruit LIS3DH@^1.2.4
	SPI
	Wire
	adafruit/Adafruit BusIO@^1.14.1
	adafruit/Adafruit Unified Sensor@^1.1.7
	adafruit/Adafruit TSL2591 Library@^1.4.3
	bblanchon/ArduinoJson@^6.21.3
	arcao/Syslog@^2.0.0
	knolleary/PubSubClient@^2.8
build_flags = 
	${env.build_flags}
	-std=c++11
	'-DWIFI_PASSWORD="${sysenv.ENV_WIFI_PW}"'
	'-DWIFI_SSID="${sysenv.ENV_WIFI_SSID}"'	
	'-DLOG_SERVER_NAME="${sysenv.ENV_LOG_SERVER_NAME}"'
	'-DLOG_SERVER_PORT=${sysenv.ENV_LOG_SERVER_PORT}'	
	'-DMQTT_USER="${sysenv.ENV_MQTT_USER}"'
	'-DMQTT_PASSWORD="${sysenv.ENV_MQTT_PW}"'
	'-DOTA_PASSWORD="${sysenv.ENV_OTA_PW}"'
build_unflags = 
	'-DPIO_UNIT_TESTING'